name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (migrate, boot, smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrantsbridge
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: migrantsbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migrantsbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://migrantsbridge:changeme@localhost:5432/migrantsbridge
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret
      FIRST_ADMIN_EMAIL: admin@ci.local
      FIRST_ADMIN_PASSWORD: ci-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Seed initial data
        run: python -m app.initial_data
      - name: Boot API and smoke test
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
          # Admin seeded above must be able to log in
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$FIRST_ADMIN_EMAIL\",\"password\":\"$FIRST_ADMIN_PASSWORD\"}" \
            | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          # Authenticated request against a representative endpoint
          curl -sf http://127.0.0.1:8000/api/v1/clients -H "Authorization: Bearer $TOKEN"
          curl -sf http://127.0.0.1:8000/api/v1/communications/threads -H "Authorization: Bearer $TOKEN"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
